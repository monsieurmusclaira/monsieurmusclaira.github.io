name: Verify portfolio

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      release:
        description: Run all three browser engines
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run check
      - name: Build site
        run: npm run build
      - name: Verify content, routes and assets
        run: npm run test:verify
      - name: Install Chromium
        if: ${{ !inputs.release }}
        run: npx --no-install playwright install --with-deps chromium
      - name: Install release browsers
        if: ${{ inputs.release }}
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Verify Chromium behavior and accessibility
        if: ${{ !inputs.release }}
        run: npm run test:browser
      - name: Verify release behavior and accessibility
        if: ${{ inputs.release }}
        run: npm run test:browser:all
      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Upload verified site
        if: ${{ inputs.release && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
